version: "3.8"

services:
  # ── Tadagram Linux Worker Auto-Updater Daemon ───────────────────────────────
  worker-updater:
    build:
      context: .
      dockerfile: Dockerfile
      target: updater
    container_name: tadagram-worker-updater
    restart: unless-stopped
    volumes:
      - ./data/workers:/app/data/workers
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app/portal_root
    environment:
      - CORE_API_URL=${CORE_API_URL:-https://core.tadagram.com}
      - CORE_API_TOKEN=${CORE_API_TOKEN:-}
      - TELEGRAM_API_ID=${TELEGRAM_API_ID:-0}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH:-}
      - TELEGRAM_RELEASE_CHANNEL=${TELEGRAM_RELEASE_CHANNEL:-tadabiz_release_manager}
      - WORKERS_DATA_DIR=/app/data/workers
      - CHECK_INTERVAL_SECONDS=${CHECK_INTERVAL_SECONDS:-1800}
    networks:
      - tadagram-worker-net

  # ── AI Controller Worker (Headless Browser Agent with CDP Screencast) ──────
  wkr-ai-controller:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: tadagram-wkr-ai-controller
    restart: unless-stopped
    ipc: host
    volumes:
      - ./data/workers/wkr-ai-controller:/app/worker
      - ./data/shared:/app/data/shared
    environment:
      - DISPLAY=:99
      - WORKER_ID=wkr-ai-controller
      - IP_TYPE=datacenter
      - CORE_API_URL=${CORE_API_URL:-https://core.tadagram.com}
      - PORTAL_DEVICE_ID=${PORTAL_DEVICE_ID:-}
      - PORTAL_WORKER_UUID=${PORTAL_WORKER_UUID:-}
      - MQTT_HOST=${MQTT_HOST:-mqtt.tadagram.com}
      - MQTT_PORT=${MQTT_PORT:-8883}
      - MQTT_TLS=1
      - CLOUDFLARE_TUNNEL_ENABLED=1
    networks:
      - tadagram-worker-net

  # ── Marketing Worker (Playwright & Multi-Account Automation) ────────────────
  wkr-marketing:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: tadagram-wkr-marketing
    restart: unless-stopped
    ipc: host
    volumes:
      - ./data/workers/wkr-marketing:/app/worker
      - ./data/shared:/app/data/shared
    environment:
      - DISPLAY=:99
      - HEADLESS=true
      - WORKER_ID=wkr-marketing
      - IP_TYPE=datacenter
      - CORE_API_URL=${CORE_API_URL:-https://core.tadagram.com}
      - PORTAL_DEVICE_ID=${PORTAL_DEVICE_ID:-}
      - PORTAL_WORKER_UUID=${PORTAL_WORKER_UUID:-}
      - MQTT_HOST=${MQTT_HOST:-mqtt.tadagram.com}
      - MQTT_PORT=${MQTT_PORT:-8883}
      - MQTT_TLS=1
    networks:
      - tadagram-worker-net

  # ── Chatbot Worker (Customer Service & Polling Automation) ──────────────────
  wkr-chatbot:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: tadagram-wkr-chatbot
    restart: unless-stopped
    ipc: host
    volumes:
      - ./data/workers/wkr-chatbot:/app/worker
      - ./data/shared:/app/data/shared
    environment:
      - DISPLAY=:99
      - HEADLESS=true
      - WORKER_ID=wkr-chatbot
      - IP_TYPE=datacenter
      - CORE_API_URL=${CORE_API_URL:-https://core.tadagram.com}
      - PORTAL_DEVICE_ID=${PORTAL_DEVICE_ID:-}
      - PORTAL_WORKER_UUID=${PORTAL_WORKER_UUID:-}
      - MQTT_HOST=${MQTT_HOST:-mqtt.tadagram.com}
      - MQTT_PORT=${MQTT_PORT:-8883}
      - MQTT_TLS=1
    networks:
      - tadagram-worker-net

networks:
  tadagram-worker-net:
    driver: bridge


